name: CI/CD Deployment

on:
  push:
    branches:
      - main  # Change to 'master' if using master branch

jobs:
  test-and-build:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Set your target Node.js version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

  deploy:
    name: Deploy to CloudPanel VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to application path
            cd ${{ secrets.APP_PATH }}

            # Fetch latest changes from Git
            git pull origin main

            # Install fresh dependencies & build
            npm ci
            npm run build --if-present

            # Reload/Restart process in PM2
            pm2 reload ecosystem.config.js --env production || pm2 restart all
